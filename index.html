<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Daily Water Quality Monitoring Report</title>
<style>
:root {
--primary: #1e3a8a;
--border: #cbd5e1;
--bg-light: #f8fafc;
--danger: #dc2626;
}

* { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }

body { background-color: #f1f5f9; margin: 0; padding: 12px; color: #0f172a; -webkit-text-size-adjust: 100%; }

.container {
max-width: 950px; margin: 0 auto; background: #ffffff; padding: 24px;
border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
position: relative; overflow: hidden;
}

/* Print View Container (Hidden on Screen) */
.print-text-block {
display: none;
white-space: pre-wrap;
word-wrap: break-word;
overflow-wrap: anywhere;
font-size: 0.82rem;
width: 100%;
}

/* Header Container */
.print-header {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 12px;
border-bottom: 2px solid var(--primary);
padding-bottom: 8px;
}
.print-header .header-title {
font-size: 1.4rem;
font-weight: bold;
color: var(--primary);
}
.print-header img {
max-height: 55px;
max-width: 180px;
object-fit: contain;
}

.section-block {
margin-bottom: 18px;
}

.section-title {
background-color: var(--primary); color: white; padding: 6px 10px;
font-weight: bold; font-size: 0.95rem; border-radius: 4px; margin-top: 10px; margin-bottom: 10px;
}

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.form-group { display: flex; flex-direction: column; }
.form-group.full-width { grid-column: 1 / -1; }

label { font-size: 0.8rem; font-weight: 600; margin-bottom: 3px; color: #334155; }

input[type="text"], input[type="number"], input[type="date"], select {
width: 100%; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.82rem; background-color: #fff;
-webkit-appearance: none; appearance: none;
}

.auto-expand {
width: 100%;
min-height: 38px;
padding: 6px 8px;
border: 1px solid var(--border);
border-radius: 4px;
font-size: 0.82rem;
background-color: #fff;
resize: none;
overflow: hidden;
white-space: pre-wrap;
word-wrap: break-word;
}

.table-container { overflow-x: auto; margin-top: 6px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; }
table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
th, td { border: 1px solid var(--border); padding: 5px 6px; text-align: left; vertical-align: middle; }
th { background-color: var(--bg-light); font-weight: 600; }

.yn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; }
.yn-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.82rem; }
.yn-item select { width: auto; }

.controls-header {
background: #e2e8f0; padding: 10px; border-radius: 6px; margin-bottom: 16px;
display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
}

.btn { background-color: var(--primary); color: white; border: none; padding: 7px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.82rem; text-align: center; text-decoration: none; display: inline-block; }
.btn-sm { padding: 4px 8px; font-size: 0.75rem; }
.btn-danger { background-color: var(--danger); }
.btn-secondary { background-color: #64748b; }
.btn-success { background-color: #16a34a; }
.btn:hover { opacity: 0.9; }

.exceedance-badge { color: var(--danger); font-weight: bold; background: #fee2e2; padding: 2px 4px; border-radius: 4px; display: inline-block; }

/* Signature Canvas Styling */
.sig-container { border: 1px solid var(--border); border-radius: 4px; background: #fff; position: relative; height: 110px; touch-action: none; }
.sig-canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
.sig-tools { position: absolute; right: 4px; bottom: 4px; z-index: 10; }

select[multiple] {
min-height: 90px;
padding: 4px;
}

.photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
.photo-card { border: 1px solid var(--border); padding: 6px; border-radius: 6px; background: #fafafa; display: flex; flex-direction: column; gap: 6px; }
.photo-card img { width: 100%; height: auto; max-height: 220px; object-fit: contain; background: #eaefe9; border-radius: 4px; }

/* Print & PDF Export Formatting */
@media print {
@page {
margin: 10mm 8mm;
}

body { background-color: white; padding: 0; font-size: 9pt; }
.container { box-shadow: none; border-radius: 0; padding: 0; max-width: 100%; overflow: visible; }
.no-print { display: none !important; }

.print-header { 
display: flex !important; 
page-break-after: avoid; 
break-after: avoid;
}

.section-block {
page-break-inside: avoid !important;
break-inside: avoid !important;
margin-bottom: 14px;
}

.sample-block {
page-break-inside: avoid !important;
break-inside: avoid !important;
margin-bottom: 12px;
}

/* Hide form elements on print */
input, textarea, select {
display: none !important;
}

/* Show full static text blocks on print */
.print-text-block {
display: block !important;
border-bottom: 1px solid #cbd5e1;
padding-bottom: 2px;
min-height: 16px;
font-size: 9pt !important;
}

table .print-text-block {
border-bottom: none !important;
}

.yn-item { border: none !important; border-bottom: 1px dotted #cbd5e1 !important; }
.section-title { 
background-color: #f1f5f9 !important; 
color: #0f172a !important; 
border: 1px solid #cbd5e1; 
page-break-after: avoid !important;
break-after: avoid !important;
}

/* Prevent image and photo grid breaks across pages */
.photo-grid {
page-break-inside: avoid !important;
break-inside: avoid !important;
}

.photo-card { 
page-break-inside: avoid !important; 
break-inside: avoid !important; 
border: 1px solid #cbd5e1; 
}

.photo-card img { 
max-height: 220px !important; 
width: 100% !important;
height: auto !important;
object-fit: contain !important; 
page-break-inside: avoid !important;
break-inside: avoid !important;
}

.sig-container { 
border: none; 
border-bottom: 1px solid #000; 
height: 75px; 
page-break-inside: avoid !important;
break-inside: avoid !important;
}

img {
page-break-inside: avoid !important;
break-inside: avoid !important;
}
}
</style>
</head>
