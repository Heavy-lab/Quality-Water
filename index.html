<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <script>
    // Enhanced service worker registration will try a local 'sw.js' and fall back to registering
    // an inline-generated blob service worker if 'sw.js' is not available (best-effort).
    // The service worker script is built below in the page (swCode) and used as a fallback.
    // This keeps the original existing registration but extends it with background-sync capabilities.
    // Registration actually happens after the main UI is defined (window.onload).
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">

  <!-- Apple/iOS PWA Meta Tags -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Water Report">
  <link rel="apple-touch-icon" href="icon-192.png">

  <title>Daily Water Quality Monitoring Report</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --border: #cbd5e1;
      --bg-light: #f8fafc;
      --danger: #dc2626;
      --success: #16a34a;
      --pending: #d97706;
      --muted: #475569;
    }

    * {
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      /* Creates a buffer space at the bottom of the viewport for focus scrolling */
      scroll-padding-bottom: 280px;
    }

    body {
      background-color: #f1f5f9;
      margin: 0;
      padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 12px) env(safe-area-inset-left, 12px);
      color: #0f172a;
      -webkit-text-size-adjust: 100%;
      transition: padding-bottom 0.25s ease-in-out;
    }
<div class="container">
  <div class="print-header">
    <div class="header-title">Daily Water Quality Monitoring Report</div>
    <img id="headerLogoDisplay" src="" alt="Company Logo" style="display: none;">
  </div>

  <div class="form-content">
    <div class="controls-header no-print">
      <div class="project-picker">
        <label for="projectSelector"><strong>Project:</strong></label>
        <select id="projectSelector" aria-label="Project selector"></select>
        <input id="newProjectName" type="text" placeholder="New project name / ID" style="padding:6px; border-radius:4px; border:1px solid var(--border);">
        <button class="btn btn-sm btn-success" type="button" onclick="createOrSwitchProject()">Create / Switch</button>
        <button class="btn btn-sm btn-secondary" type="button" onclick="renameProject()">Rename</button>
        <button class="btn btn-sm btn-danger" type="button" onclick="deleteProject()" title="Delete current project's local cache">Delete Local</button>
      </div>

      <div style="display:flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center;">
        <button class="btn btn-warning" type="button" onclick="manualSaveProgress()">Save Progress</button>
        <div class="save-indicator-container">
          <span id="saveStatusIndicator" style="font-size: 0.8rem; color: #475569;"></span>
        </div>
        <button class="btn btn-success" type="button" onclick="downloadMasterTemplate()">Download Template</button>
        <button class="btn btn-secondary" type="button" onclick="document.getElementById('masterFileInput').click()">Upload Template</button>
        <input type="file" id="masterFileInput" accept=".json" style="display:none;" onchange="uploadMasterTemplate(event)">
        <button class="btn btn-sm" type="button" onclick="triggerPrintOrPDF()">Print / Save PDF</button>
      </div>
    </div>

    <!-- PART I -->
    <div class="section-block">
      <div class="section-title">Part I. General Information</div>
      <div class="grid">
        <div class="form-group full-width">
          <label>Project Name:</label>
          <textarea class="auto-expand" id="projName" rows="1" oninput="autoResize(this)">05-1G9504 DRAINAGE SYSTEM UPGRADES AND SLOPE STABILIZATION</textarea>
        </div>
        <div class="form-group">
          <label>Project Number:</label>
          <textarea class="auto-expand" id="projNum" rows="1" oninput="autoResize(this)">05-1G9504 | 05-SCr-9-9.0/25.5</textarea>
        </div>
        <div class="form-group">
          <label>401 WDID Number:</label>
          <textarea class="auto-expand" id="wdidNum" rows="1" oninput="autoResize(this)">WPCP (2022)</textarea>
        </div>
        <div class="form-group full-width">
          <label>Project Address:</label>
          <textarea class="auto-expand" id="projAddr" rows="1" oninput="autoResize(this)">Location 15 – On Route 9 at Post Mile 17.89</textarea>
        </div>
        <div class="form-group">
          <label>Approximate Coordinates:</label>
          <textarea class="auto-expand" id="projCoords" rows="1" oninput="autoResize(this)">37.188745, -122.143153</textarea>
        </div>
        <div class="form-group">
          <label>Monitoring Performed By:</label>
          <textarea class="auto-expand" id="monBy" rows="1" oninput="autoResize(this)">Tully Consulting Group</textarea>
        </div>
        <div class="form-group">
          <label>Inspector Name & Title:</label>
          <textarea class="auto-expand" id="inspName" rows="1" oninput="autoResize(this)">Inspector</textarea>
        </div>

        <div class="form-group">
          <label>Inspector Signature (Draw Below):</label>
          <div class="sig-container" id="sigContainer">
            <canvas id="sigCanvas" class="sig-canvas"></canvas>
            <div class="sig-tools no-print">
              <button class="btn btn-sm btn-secondary" type="button" onclick="clearSignature()">Clear</button>
            </div>
          </div>
        </div>

        <div class="form-group"><label>Date of Sampling:</label><input type="date" id="dateSampling"></div>
        <div class="form-group"><label>Date Report Completed:</label><input type="date" id="dateCompleted"></div>
      </div>

      <p style="margin-top:10px; margin-bottom:4px;"><strong>Weather Information</strong></p>
      <div class="grid">
        <div class="form-group">
          <label>Antecedent Conditions (48 hrs):</label>
          <textarea class="auto-expand" id="weatherAnt" rows="1" oninput="autoResize(this)">Sunny</textarea>
        </div>
        <div class="form-group">
          <label>Current Weather:</label>
          <textarea class="auto-expand" id="weatherCur" rows="1" oninput="autoResize(this)">Sunny</textarea>
        </div>
        <div class="form-group">
          <label>Precipitation Forecast (NOAA):</label>
          <textarea class="auto-expand" id="weatherForecast" rows="1" oninput="autoResize(this)">None Predicted</textarea>
        </div>
        <div class="form-group">
          <label>Wind Condition:</label>
          <textarea class="auto-expand" id="weatherWind" rows="1" oninput="autoResize(this)">&lt; 5 mph</textarea>
        </div>
      </div>

      <div class="form-group full-width" style="margin-top: 6px;">
        <label>Exception Documentation (required if sampling was not conducted):</label>
        <textarea class="auto-expand" id="exceptionDoc" rows="1" oninput="autoResize(this)" placeholder="Enter exception explanation or N/A">N/A</textarea>
      </div>

      <p style="margin-top:10px; margin-bottom:4px;"><strong>Site Activity (Hold Ctrl/Cmd to select multiple):</strong></p>
      <div class="form-group full-width">
        <select id="siteActivitySelect" multiple>
          <option value="Installation of Clear Water Diversion">Installation of Clear Water Diversion</option>
          <option value="Active Diversion">Active Diversion</option>
          <option value="Background Sampling">Background Sampling</option>
          <option value="Removal of Clear Water Diversion">Removal of Clear Water Diversion</option>
          <option value="Other In-Water Work">Other In-Water Work</option>
        </select>
      </div>
      <div class="form-group full-width" style="margin-top: 4px;">
        <label>Other Site Activity Details:</label>
        <textarea class="auto-expand" id="saOther" rows="1" oninput="autoResize(this)"></textarea>
      </div>
    </div>

    .container {
      max-width: 950px; margin: 0 auto; background: #ffffff; padding: 24px;
      border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: relative; overflow: hidden;
    }

    /* Print View Container - Now strictly centered */
    .print-text-block {
      display: none;
      white-space: pre-wrap !important;
      word-wrap: break-word !important;
      overflow-wrap: anywhere !important;
      overflow: visible !important;
      height: auto !important;
      font-size: 14px;
      width: 100%;
      text-align: center !important;
      justify-content: center !important;
      align-items: center !important;
    }

    .print-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; border-bottom: 2px solid var(--primary); padding-bottom: 8px;
    }
    .print-header .header-title { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
    .print-header img { max-height: 55px; max-width: 180px; object-fit: contain; }

    .section-block { margin-bottom: 18px; }
    .section-title {
      background-color: var(--primary); color: white; padding: 6px 10px;
      font-weight: bold; font-size: 1rem; border-radius: 4px; margin-top: 10px; margin-bottom: 10px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: 1 / -1; }

    label { font-size: 0.85rem; font-weight: 600; margin-bottom: 3px; color: #334155; }

    input[type="text"], input[type="number"], input[type="date"], select {
      width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px;
      font-size: 16px; background-color: #fff;
      -webkit-appearance: none; appearance: none;
    }

    .auto-expand {
      width: 100%; min-height: 40px; padding: 8px; border: 1px solid var(--border);
      border-radius: 4px; font-size: 16px; background-color: #fff; resize: none;
      overflow: hidden; white-space: pre-wrap; word-wrap: break-word;
      -webkit-appearance: none; appearance: none;
      position: relative;
    }

    .table-container { overflow-x: auto; margin-top: 6px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 5px 6px; text-align: left; vertical-align: middle; }
    th { background-color: var(--bg-light); font-weight: 600; }

    .yn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; }
    .yn-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; }
    .yn-item select { width: auto; font-size: 16px; padding: 4px 8px; }

    .controls-header {
      background: #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 16px;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    }

    .save-indicator-container { min-width: 140px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }

    .btn { background-color: var(--primary); color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; text-align: center; text-decoration: none; display: inline-block; }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
    .btn-danger { background-color: var(--danger); }
    .btn-secondary { background-color: #64748b; }
    .btn-success { background-color: var(--success); }
    .btn-warning { background-color: var(--pending); color: white; }
    .btn:hover, .btn:active { opacity: 0.85; }

    .exceedance-badge { color: var(--danger); font-weight: bold; background: #fee2e2; padding: 2px 4px; border-radius: 4px; display: inline-block; }

    .sig-container { border: 1px solid var(--border); border-radius: 4px; background: #fff; position: relative; height: 120px; touch-action: none; }
    .sig-canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
    .sig-tools { position: absolute; right: 4px; bottom: 4px; z-index: 10; }

    select[multiple] { min-height: 100px; padding: 4px; }

    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
    .photo-card { border: 1px solid var(--border); padding: 6px; border-radius: 6px; background: #fafafa; display: flex; flex-direction: column; gap: 6px; }
    .photo-card img { width: 100%; height: auto; max-height: 220px; object-fit: contain; background: #eaefe9; border-radius: 4px; }
    .photo-card-actions { display: flex; justify-content: flex-end; }

    .project-picker { display:flex; gap:8px; align-items:center; }

    .coord-badge {
      font-size: 0.85rem;
      background: #f1f5f9;
      border: 1px dashed var(--border);
      padding: 4px 8px;
      border-radius: 4px;
      display: inline-block;
      margin-left: 8px;
    }

    @media (max-width: 600px) {
      .photo-grid { grid-template-columns: 1fr; }
      .controls-header { flex-direction: column; align-items: stretch; }
      .controls-header > div { display: flex; flex-direction: column; gap: 8px; }
    }

    @media print {
      @page { margin: 10mm 8mm; }
      body { background-color: white; padding: 0; font-size: 9pt; }
      .container { box-shadow: none; border-radius: 0; padding: 0; max-width: 100%; overflow: visible; }
      .no-print { display: none !important; }
      .print-header { display: flex !important; page-break-after: avoid; }
      .section-block { page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 14px; }
      .sample-block { page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 12px; }
      .photo-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; page-break-inside: auto !important; break-inside: auto !important; }
      .photo-card { page-break-inside: avoid !important; break-inside: avoid !important; border: 1px solid #cbd5e1 !important; display: flex !important; flex-direction: column !important; }
      .photo-card img { max-height: 200px !important; object-fit: contain !important; page-break-inside: avoid !important; break-inside: avoid !important; }

      input, textarea, select { display: none !important; }
      .print-text-block { display: flex !important; border-bottom: 1px solid #cbd5e1; padding-bottom: 2px; min-height: 16px; font-size: 9pt !important; }
      table .print-text-block { border-bottom: none !important; }

      .yn-item { border: none !important; border-bottom: 1px dotted #cbd5e1 !important; }
      .section-title { background-color: #f1f5f9 !important; color: #0f172a !important; border: 1px solid #cbd5e1; page-break-after: avoid; }
      .sig-container { border: none; border-bottom: 1px solid #000; height: 75px; }
    }

    /* Sync status badges */
    .sync-badge { padding: 4px 8px; border-radius: 12px; font-weight: 600; font-size: 0.85rem; }
    .sync-synced { background: #ecfdf5; color: var(--success); border: 1px solid rgba(16,185,129,0.12); }
    /* additional sync-badge state classes (e.g. .sync-pending, .sync-error) continue below in the next part */
        <!-- PART II -->
    <div class="section-block">
      <div class="section-title">Part II. Visual Inspection Report</div>
      <p style="margin-bottom:4px;"><strong>Observations of Receiving Water for Presence of Contaminants:</strong></p>

      <div class="yn-grid" id="ynGrid">
        <div class="yn-item"><span>Floating/Suspended Materials</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Surface Sheen</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Discoloration</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Turbidity</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Odors</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Soil, Silt, and Sand</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Bark, Sawdust, Slash</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Rubbish and Debris</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Cement / Washings</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Oil & Petroleum</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Welding Slag</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
        <div class="yn-item"><span>Other Organic/Earthen</span><select class="yn-sel"><option>N</option><option>Y</option></select></div>
      </div>

      <div class="form-group full-width" style="margin-top: 6px;">
        <label>Sources of Observed Pollutants / Details:</label>
        <textarea class="auto-expand" id="pollutantDetails" rows="1" oninput="autoResize(this)" placeholder="Describe sources if contaminants were observed"></textarea>
      </div>

      <div class="form-group full-width" style="margin-top: 6px;">
        <label>Additional Comments:</label>
        <textarea class="auto-expand" id="part2Comments" rows="1" oninput="autoResize(this)" placeholder="Enter additional comments..."></textarea>
      </div>
    </div>

    <!-- PART III -->
    <div class="section-block">
      <div class="section-title">Part III. Sampling Locations</div>
      <div class="table-container">
        <table id="locationsTable">
          <thead>
            <tr>
              <th style="width: 25%;">Location</th><th style="width: 30%;">Coordinates</th><th style="width: 35%;">Description</th><th class="no-print" style="width: 10%;">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">Upstream</textarea></td>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">37.188633, -122.143450</textarea></td>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">15 feet from diversion pipe.</textarea></td>
              <td class="no-print"><button class="btn btn-sm btn-danger" type="button" onclick="removeRow(this)">Remove</button></td>
            </tr>
            <tr>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">Effluent</textarea></td>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">N/A</textarea></td>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">N/A</textarea></td>
              <td class="no-print"><button class="btn btn-sm btn-danger" type="button" onclick="removeRow(this)">Remove</button></td>
            </tr>
            <tr>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">Downstream</textarea></td>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">37.188834, -122.143041</textarea></td>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">35 feet diversion pipe.</textarea></td>
              <td class="no-print"><button class="btn btn-sm btn-danger" type="button" onclick="removeRow(this)">Remove</button></td>
            </tr>
          </tbody>
        </table>
      </div>
      <button class="btn btn-sm no-print" type="button" onclick="addLocationRow()">+ Add Location</button>
    </div>

    <!-- WATER QUALITY OBJECTIVES -->
    <div class="section-block">
      <div class="section-title">Water Quality Objectives</div>
      <div class="table-container">
        <table id="objectivesTable">
          <thead>
            <tr>
              <th style="width: 5%;">#</th><th style="width: 25%;">Quality Characteristic</th><th style="width: 15%;">Test Method</th><th style="width: 15%;">Detection Limit (min)</th><th style="width: 20%;">Objective / Threshold</th><th style="width: 15%;">Exceedance Logic</th><th class="no-print">Action</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td style="text-align: center; font-weight: bold;" class="row-num">1</td>
              <td><textarea class="auto-expand obj-param" rows="1" oninput="autoResize(this); syncObjectiveNames(); runExceedanceCheck();">Turbidity (NTU)</textarea></td>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">Field Meter</textarea></td>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">1 NTU</textarea></td>
              <td><textarea class="auto-expand" rows="1" oninput="autoResize(this)">< 20% Increase</textarea></td>
              <td>
                <select class="obj-type" onchange="toggleVal2(this); runExceedanceCheck();">
                  <option value="pct_gt">Downstream > Upstream by %</option>
                  <option value="val_diff_gt">Downstream > Upstream by Value</option>
                  <option value="any_sample_pct">Any Sample Over %</option>
                  <option value="any_sample_val">Any Sample Over Value</option>
                  <option value="val_gt">Value Greater Than</option>
                  <option value="val_eq">Value Equals</option>
                  <option value="val_between">Outside Range (Min/Max)</option>
                </select>
                <input type="number" step="any" class="obj-val1" value="20" placeholder="Val or %" style="margin-top:4px;" onchange="runExceedanceCheck()">
                <input type="number" step="any" class="obj-val2" placeholder="Max Val" style="display:none; margin-top:4px;" onchange="runExceedanceCheck()">
              </td>
              <td class="no-print"><button class="btn btn-sm btn-danger" type="button" onclick="removeObjectiveRow(this)">Remove</button></td>
            </tr>
          </tbody>
        </table>
      </div>
      <button class="btn btn-sm no-print" type="button" onclick="addObjectiveRow()">+ Add Objective</button>
    </div>

    <!-- PART IV -->
    <div class="section-block">
      <div class="section-title">Part IV. Water Quality Sampling and Analysis Log</div>
      <div id="sampleLogsContainer"></div>
      <button class="btn btn-sm no-print" type="button" onclick="addSampleBlock()" style="margin-top: 8px;">+ Add New Sample Set</button>
      <p style="font-size: 0.85rem; color: #64748b; margin-top: 8px;">* Describe any in-water work, sources of exceedances, or corrective measures taken in response to an exceedance.</p>
    </div>

    <!-- PHOTO LOG -->
    <div class="section-block" style="page-break-inside: auto; break-inside: auto;">
      <div class="section-title">Photo Documentation Log</div>
      <div class="no-print" style="margin-bottom: 8px;">
        <label>Attach Site Photos:</label><br>
        <input type="file" id="photoUpload" accept="image/*" multiple onchange="handlePhotoUpload(event)" style="padding: 0; border: none;">
      </div>
      <div class="photo-grid" id="photoGrid"></div>
    </div>
  </div>
</div>

<script>
  /**********************************************************************
   * Multi-project & IndexedDB storage, offline queue, background-sync
   * GPS auto-tagging per sample block
   * Photo compression & EXIF stripping before storing
   * PDF export via jsPDF (dynamically loaded; cached by service worker)
   * Sync status indicator per project
   **********************************************************************/

  // ----- Lightweight IndexedDB helpers -----
  const DB_NAME = 'wq_reports_db_v1';
  const DB_VERSION = 1;
  let dbPromise = null;
  function openDB() {
    if (dbPromise) return dbPromise;
    dbPromise = new Promise((resolve, reject) => {
      const r = indexedDB.open(DB_NAME, DB_VERSION);
      // (object store creation / upgrade logic continues here)
    });
    return dbPromise;
  }
