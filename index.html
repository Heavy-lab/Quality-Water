<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').then(registration => {
          // Feature 3: Offline-First Background Sync Registration
          if ('sync' in registration) {
            document.getElementById('syncFormBtn').addEventListener('click', () => {
              registration.sync.register('sync-reports')
                .then(() => updateSyncStatus('Pending Sync', 'warning'))
                .catch(err => console.warn('Sync registration failed:', err));
            });
          }
        }).catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Water Report">
  <link rel="apple-touch-icon" href="icon-192.png">
  
  <title>Daily Water Quality Monitoring Report</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --border: #cbd5e1;
      --bg-light: #f8fafc;
      --danger: #dc2626;
      --warning: #d97706;
      --success: #16a34a;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html { scroll-padding-bottom: 280px; }
    body { background-color: #f1f5f9; margin: 0; padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 12px) env(safe-area-inset-left, 12px); color: #0f172a; }

    .container { max-width: 950px; margin: 0 auto; background: #ffffff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
    
    .print-header { display: flex; flex-direction: column; align-items: center; margin-bottom: 12px; border-bottom: 2px solid var(--primary); padding-bottom: 8px; text-align: center; }
    .print-header .header-title { font-size: 1.6rem; font-weight: bold; color: var(--primary); margin-bottom: 4px; }
    .print-header .header-subtitle { font-size: 1.1rem; font-weight: 600; color: #475569; }
    
    .section-title { background-color: var(--primary); color: white; padding: 6px 10px; font-weight: bold; font-size: 1rem; border-radius: 4px; margin: 16px 0 10px 0; }
    
    .controls-header { background: #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 16px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .form-group { display: flex; flex-direction: column; position: relative; }
    
    label { font-size: 0.85rem; font-weight: 600; margin-bottom: 3px; color: #334155; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 16px; background-color: #fff; }
    
    .btn { background-color: var(--primary); color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; }
    .btn-icon { padding: 8px; border-radius: 4px; background: #cbd5e1; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
    .btn-danger { background-color: var(--danger); }
    .btn-secondary { background-color: #64748b; }
    .btn-success { background-color: var(--success); }
    .btn-warning { background-color: var(--warning); color: white; }
    
    .input-with-action { display: flex; gap: 4px; }
    .input-with-action input { flex-grow: 1; }
    
    .exceedance-badge { color: white; font-weight: bold; background: var(--danger); padding: 2px 6px; border-radius: 4px; display: none; font-size: 0.75rem; position: absolute; top: 0; right: 0; }
    .exceedance-active { display: inline-block; }
    .input-error { border-color: var(--danger) !important; background-color: #fef2f2 !important; }

    .sig-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 10px; }
    .sig-wrapper { display: flex; flex-direction: column; }
    .sig-container { border: 1px solid var(--border); border-radius: 4px; background: #fff; height: 120px; position: relative; touch-action: none; }
    .sig-canvas { width: 100%; height: 100%; cursor: crosshair; }
    
    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
    .photo-card { border: 1px solid var(--border); padding: 6px; border-radius: 6px; background: #fafafa; }
    
    .status-badge { padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; color: white; }
    .status-saved { background: var(--success); }
    .status-pending { background: var(--warning); }
    
    @media (max-width: 600px) {
      .sig-grid { grid-template-columns: 1fr; }
      .photo-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div class="container" id="reportContainer">
  <div class="print-header">
    <div class="header-title">Tully Consulting Group, an Apex Company</div>
    <div class="header-subtitle">Daily Water Quality Monitoring Report</div>
  </div>
  
  <div class="form-content">
    
    <!-- Top Bar Controls -->
    <div class="controls-header no-print">
      <!-- Feature 1: Multi-Project Switcher -->
      <div class="form-group" style="min-width: 200px;">
        <label for="projectSelector">Active Project Workspace:</label>
        <select id="projectSelector" onchange="switchProjectWorkspace(this.value)">
          <option value="proj_default">Default Site</option>
          <option value="proj_alpha">Site Alpha - Hwy 101</option>
          <option value="proj_beta">Site Beta - River Bridge</option>
        </select>
      </div>

      <!-- Feature 9: Template Library -->
      <div class="form-group">
        <label for="templateSelector">Load Site Template:</label>
        <select id="templateSelector" onchange="applyTemplate(this.value)">
          <option value="">-- Select Template --</option>
          <option value="storm">Storm Event Sampling</option>
          <option value="routine">Routine BMP Inspection</option>
        </select>
      </div>

      <div style="display:flex; gap: 8px; align-items: center; flex-wrap: wrap;">
        <!-- Feature 10: Conflict-Free Sync Indicator -->
        <div id="syncStatusIndicator" class="status-badge status-saved">Saved Locally</div>
        <button class="btn btn-warning" type="button" onclick="saveCurrentState()">Save</button>
        <button class="btn btn-secondary" type="button" id="syncFormBtn">Queue Sync</button>
        <!-- Feature 8: PDF Export -->
        <button class="btn btn-success" type="button" onclick="generateClientPDF()">Export PDF</button>
      </div>
    </div>

    <!-- Location & GPS -->
    <div class="section-title">Sample Location Data</div>
    <div class="grid">
      <div class="form-group">
        <label>Location ID / Station</label>
        <input type="text" id="stationId" placeholder="e.g. Outfall 001">
      </div>
      <!-- Feature 2: GPS Auto-Tagging -->
      <div class="form-group">
        <label>Coordinates (Lat/Long)</label>
        <div class="input-with-action">
          <input type="text" id="gpsCoordinates" placeholder="Tap to map..." readonly>
          <button class="btn-icon" type="button" onclick="captureGPS()" title="Get Current Location">📍</button>
        </div>
      </div>
    </div>

    <!-- Quality Data & Exceedances -->
    <div class="section-title">Water Quality Parameters</div>
    <div class="grid">
      <!-- Feature 4: Exceedance Auto-Flagging (pH Thresholds: 6.5 - 8.5) -->
      <div class="form-group">
        <label>pH Level <span class="exceedance-badge" id="badge-ph">Exceedance (CA Title 22)</span></label>
        <input type="number" step="0.1" id="param-ph" oninput="checkExceedance(this, 'ph', 6.5, 8.5)">
      </div>
      
      <!-- Feature 4: Turbidity Threshold (e.g. > 250 NTU) -->
      <div class="form-group">
        <label>Turbidity (NTU) <span class="exceedance-badge" id="badge-turbidity">Action Level</span></label>
        <input type="number" step="1" id="param-turbidity" oninput="checkExceedance(this, 'turb', 0, 250)">
      </div>
    </div>

    <!-- Field Notes & Dictation -->
    <div class="section-title">Observations & Field Notes</div>
    <div class="form-group">
      <!-- Feature 6: Voice-to-Text Field Notes -->
      <label>Site Conditions & Narrative 
        <button type="button" style="border:none; background:none; cursor:pointer;" onclick="startDictation('fieldNotes')" title="Dictate Notes">🎙️ (Dictate)</button>
      </label>
      <textarea id="fieldNotes" rows="4" placeholder="Enter observations..."></textarea>
    </div>

    <!-- Photos -->
    <div class="section-title">Photographic Evidence</div>
    <div class="form-group no-print">
      <label>Upload/Take Photo (Auto-Compressed)</label>
      <input type="file" accept="image/*" capture="environment" onchange="processAndCompressPhoto(event)">
    </div>
    <div class="photo-grid" id="photoContainer"></div>

    <!-- Signatures -->
    <div class="section-title">Signatures</div>
    <!-- Feature 5: Digital Signature Persistence & Multi-Signer Support -->
    <div class="sig-grid">
      <div class="sig-wrapper">
        <label>Inspector Signature</label>
        <div class="sig-container">
          <canvas class="sig-canvas" id="canvas-inspector"></canvas>
          <button class="btn-sm btn-secondary" style="position:absolute; bottom:2px; right:2px;" onclick="clearCanvas('canvas-inspector')">Clear</button>
        </div>
        <input type="text" id="inspectorName" placeholder="Inspector Name" style="margin-top: 4px;">
      </div>
      
      <div class="sig-wrapper">
        <label>Site Supervisor Signature</label>
        <div class="sig-container">
          <canvas class="sig-canvas" id="canvas-supervisor"></canvas>
          <button class="btn-sm btn-secondary" style="position:absolute; bottom:2px; right:2px;" onclick="clearCanvas('canvas-supervisor')">Clear</button>
        </div>
        <input type="text" id="supervisorName" placeholder="Supervisor Name" style="margin-top: 4px;">
      </div>
    </div>

  </div>
</div>

<script>
  let activeProjectId = 'proj_default';
  
  // --- Feature 1: Multi-Project Switcher with Local Storage Isolation ---
  function switchProjectWorkspace(projectId) {
    saveCurrentState(); // Save current before switching
    activeProjectId = projectId;
    loadProjectState(projectId);
    updateSyncStatus('Saved Locally', 'success');
  }

  function saveCurrentState() {
    const data = {
      stationId: document.getElementById('stationId').value,
      gps: document.getElementById('gpsCoordinates').value,
      ph: document.getElementById('param-ph').value,
      turbidity: document.getElementById('param-turbidity').value,
      notes: document.getElementById('fieldNotes').value,
      inspector: document.getElementById('inspectorName').value,
      supervisor: document.getElementById('supervisorName').value
    };
    // Namespace using the active project ID
    localStorage.setItem(`wq_data_${activeProjectId}`, JSON.stringify(data));
    updateSyncStatus('Saved Locally', 'success');
  }

  function loadProjectState(projectId) {
    const stored = localStorage.getItem(`wq_data_${projectId}`);
    if (stored) {
      const data = JSON.parse(stored);
      document.getElementById('stationId').value = data.stationId || '';
      document.getElementById('gpsCoordinates').value = data.gps || '';
      document.getElementById('param-ph').value = data.ph || '';
      document.getElementById('param-turbidity').value = data.turbidity || '';
      document.getElementById('fieldNotes').value = data.notes || '';
      document.getElementById('inspectorName').value = data.inspector || '';
      document.getElementById('supervisorName').value = data.supervisor || '';
      
      // Re-trigger exceedance checks on load
      checkExceedance(document.getElementById('param-ph'), 'ph', 6.5, 8.5);
      checkExceedance(document.getElementById('param-turbidity'), 'turb', 0, 250);
    } else {
      // Clear form if no data exists for this project
      document.querySelectorAll('input:not([type="file"]), textarea').forEach(el => el.value = '');
      document.querySelectorAll('.exceedance-badge').forEach(el => el.classList.remove('exceedance-active'));
      document.querySelectorAll('.input-error').forEach(el => el.classList.remove('input-error'));
    }
  }

  // --- Feature 2: GPS Auto-Tagging ---
  function captureGPS() {
    const gpsInput = document.getElementById('gpsCoordinates');
    gpsInput.value = "Acquiring location...";
    
    if ("geolocation" in navigator) {
      navigator.geolocation.getCurrentPosition(
        (position) => {
          const lat = position.coords.latitude.toFixed(5);
          const lon = position.coords.longitude.toFixed(5);
          gpsInput.value = `${lat}, ${lon}`;
          saveCurrentState();
        },
        (error) => {
          gpsInput.value = "GPS Error: " + error.message;
        },
        { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
      );
    } else {
      gpsInput.value = "Geolocation not supported.";
    }
  }

  // --- Feature 4: California Water Board Exceedance Auto-Flagging ---
  function checkExceedance(inputEl, paramId, min, max) {
    const val = parseFloat(inputEl.value);
    const badge = document.getElementById(paramId === 'ph' ? 'badge-ph' : 'badge-turbidity');
    
    if (!isNaN(val) && (val < min || val > max)) {
      badge.classList.add('exceedance-active');
      inputEl.classList.add('input-error');
    } else {
      badge.classList.remove('exceedance-active');
      inputEl.classList.remove('input-error');
    }
    saveCurrentState();
  }

  // --- Feature 6: Voice-to-Text Field Notes ---
  function startDictation(targetId) {
    const targetEl = document.getElementById(targetId);
    if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      const recognition = new SpeechRecognition();
      
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onstart = function() {
        targetEl.placeholder = "Listening... Speak now.";
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        targetEl.value += (targetEl.value.length > 0 ? " " : "") + transcript;
        saveCurrentState();
      };

      recognition.onerror = function(event) {
        alert("Speech recognition error: " + event.error + ". Falling back to manual entry.");
      };

      recognition.onend = function() {
        targetEl.placeholder = "Enter observations...";
      };

      recognition.start();
    } else {
      alert("Voice recognition is not supported in this browser. MediaRecorder fallback would initiate here.");
      // Fallback logic utilizing MediaRecorder API to save audio blob to IndexedDB would go here.
    }
  }

  // --- Feature 7: Photo Compression & EXIF Stripping ---
  function processAndCompressPhoto(event) {
    const file = event.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = function() {
        const canvas = document.createElement('canvas');
        const MAX_WIDTH = 800;
        const MAX_HEIGHT = 800;
        let width = img.width;
        let height = img.height;

        if (width > height) {
          if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
        } else {
          if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        // Compress to JPEG at 70% quality (strips EXIF automatically via canvas rendering)
        const compressedDataUrl = canvas.toDataURL('image/jpeg', 0.7);
        
        // Render to DOM
        const photoDiv = document.createElement('div');
        photoDiv.className = 'photo-card';
        photoDiv.innerHTML = `<img src="${compressedDataUrl}" style="width:100%; height:auto; border-radius:4px;">`;
        document.getElementById('photoContainer').appendChild(photoDiv);
        
        // In a production app, the Base64 string 'compressedDataUrl' is saved to IndexedDB here
        updateSyncStatus('Pending Sync', 'warning');
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  // --- Feature 8: PDF Export Independent of Browser Print ---
  async function generateClientPDF() {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p', 'pt', 'letter');
    
    // Use html2canvas to screenshot the container and place it in the PDF
    const reportElement = document.getElementById('reportContainer');
    
    // Temporarily hide UI controls for cleaner PDF
    const noPrintElements = document.querySelectorAll('.no-print');
    noPrintElements.forEach(el => el.style.display = 'none');

    try {
      const canvas = await html2canvas(reportElement, { scale: 2 });
      const imgData = canvas.toDataURL('image/jpeg', 0.9);
      
      const pdfWidth = doc.internal.pageSize.getWidth();
      const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
      
      doc.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
      doc.save(`Water_Report_${activeProjectId}_${new Date().toISOString().split('T')[0]}.pdf`);
    } catch (err) {
      console.error("PDF generation failed", err);
      alert("Failed to generate PDF.");
    } finally {
      // Restore UI elements
      noPrintElements.forEach(el => el.style.display = '');
    }
  }

  // --- Feature 9: Template Library ---
  function applyTemplate(type) {
    const notesEl = document.getElementById('fieldNotes');
    if (type === 'storm') {
      notesEl.value = "Pre-storm inspection completed. BMPs intact. Visually inspected outfalls for sediment discharge. Minor maintenance required on silt fencing at southern perimeter.";
    } else if (type === 'routine') {
      notesEl.value = "Routine weekly inspection. No active discharge. Site stabilized. Street sweeping confirmed completed this morning.";
    }
    saveCurrentState();
  }

  // --- Feature 10: Sync Status Indicator ---
  function updateSyncStatus(text, type) {
    const indicator = document.getElementById('syncStatusIndicator');
    indicator.textContent = text;
    indicator.className = `status-badge status-${type === 'warning' ? 'pending' : 'saved'}`;
  }

  // --- Feature 5 Setup: Simple Canvas Hooks ---
  function setupSignaturePads() {
    ['canvas-inspector', 'canvas-supervisor'].forEach(id => {
      const canvas = document.getElementById(id);
      const ctx = canvas.getContext('2d');
      let isDrawing = false;

      // Adjust canvas resolution
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;

      canvas.addEventListener('pointerdown', e => { isDrawing = true; ctx.beginPath(); ctx.moveTo(e.offsetX, e.offsetY); });
      canvas.addEventListener('pointermove', e => { if (isDrawing) { ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); }});
      canvas.addEventListener('pointerup', () => { isDrawing = false; updateSyncStatus('Pending Sync', 'warning'); });
      canvas.addEventListener('pointerout', () => { isDrawing = false; });
    });
  }

  function clearCanvas(id) {
    const canvas = document.getElementById(id);
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // Initialization
  window.addEventListener('DOMContentLoaded', () => {
    loadProjectState(activeProjectId);
    setupSignaturePads();
  });
</script>
</body>
</html>
