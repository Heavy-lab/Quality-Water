<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="manifest" href="manifest.json">
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW registration failed:', err));
      });
    }
  </script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Daily Water Quality Monitoring Report</title>
  <style>
    :root {
      --primary: #1e3a8a;
      --border: #cbd5e1;
      --bg-light: #f8fafc;
      --danger: #dc2626;
    }

    * { 
      box-sizing: border-box; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen-Sans, Ubuntu, Cantarell, "Helvetica Neue", sans-serif;
      -webkit-tap-highlight-color: transparent; 
    }

    html {
      /* Creates a buffer space at the bottom of the viewport for focus scrolling */
      scroll-padding-bottom: 280px;
    }

    body { 
      background-color: #f1f5f9; 
      margin: 0; 
      padding: env(safe-area-inset-top, 12px) env(safe-area-inset-right, 12px) env(safe-area-inset-bottom, 12px) env(safe-area-inset-left, 12px); 
      color: #0f172a; 
      -webkit-text-size-adjust: 100%; 
      transition: padding-bottom 0.25s ease-in-out;
    }

    .container {
      max-width: 950px; margin: 0 auto; background: #ffffff; padding: 24px;
      border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      position: relative; overflow: hidden;
    }

    /* Print View Container - Now strictly centered */
    .print-text-block {
      display: none;
      white-space: pre-wrap !important;
      word-wrap: break-word !important;
      overflow-wrap: anywhere !important;
      overflow: visible !important;
      height: auto !important;
      font-size: 14px;
      width: 100%;
      text-align: center !important;
      justify-content: center !important;
      align-items: center !important;
    }

    .print-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 12px; border-bottom: 2px solid var(--primary); padding-bottom: 8px;
    }
    .print-header .header-title { font-size: 1.4rem; font-weight: bold; color: var(--primary); }
    .print-header img { max-height: 55px; max-width: 180px; object-fit: contain; }

    .section-block { margin-bottom: 18px; }
    .section-title {
      background-color: var(--primary); color: white; padding: 6px 10px;
      font-weight: bold; font-size: 1rem; border-radius: 4px; margin-top: 10px; margin-bottom: 10px;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .form-group { display: flex; flex-direction: column; }
    .form-group.full-width { grid-column: 1 / -1; }

    label { font-size: 0.85rem; font-weight: 600; margin-bottom: 3px; color: #334155; }

    input[type="text"], input[type="number"], input[type="date"], select {
      width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 4px; 
      font-size: 16px; background-color: #fff;
      -webkit-appearance: none; appearance: none;
    }

    .auto-expand {
      width: 100%; min-height: 40px; padding: 8px; border: 1px solid var(--border);
      border-radius: 4px; font-size: 16px; background-color: #fff; resize: none;
      overflow: hidden; white-space: pre-wrap; word-wrap: break-word;
      -webkit-appearance: none; appearance: none;
    }

    .table-container { overflow-x: auto; margin-top: 6px; margin-bottom: 6px; -webkit-overflow-scrolling: touch; }
    table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
    th, td { border: 1px solid var(--border); padding: 5px 6px; text-align: left; vertical-align: middle; }
    th { background-color: var(--bg-light); font-weight: 600; }

    .yn-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 6px; }
    .yn-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.9rem; }
    .yn-item select { width: auto; font-size: 16px; padding: 4px 8px; }

    .controls-header {
      background: #e2e8f0; padding: 12px; border-radius: 6px; margin-bottom: 16px;
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px;
    }

    .save-indicator-container { min-width: 140px; height: 20px; display: inline-flex; align-items: center; justify-content: center; }

    .btn { background-color: var(--primary); color: white; border: none; padding: 10px 14px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem; text-align: center; text-decoration: none; display: inline-block; transition: opacity 0.2s; }
    .btn-sm { padding: 6px 10px; font-size: 0.8rem; }
    .btn-danger { background-color: var(--danger); }
    .btn-secondary { background-color: #64748b; }
    .btn-success { background-color: #16a34a; }
    .btn-warning { background-color: #d97706; color: white; }
    .btn:hover, .btn:active { opacity: 0.85; }

    .exceedance-badge { color: var(--danger); font-weight: bold; background: #fee2e2; padding: 2px 4px; border-radius: 4px; display: inline-block; }

    .sig-container { border: 1px solid var(--border); border-radius: 4px; background: #fff; position: relative; height: 120px; touch-action: none; }
    .sig-canvas { width: 100%; height: 100%; touch-action: none; cursor: crosshair; display: block; }
    .sig-tools { position: absolute; right: 4px; bottom: 4px; z-index: 10; }

    select[multiple] { min-height: 100px; padding: 4px; }

    .photo-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-top: 10px; }
    .photo-card { border: 1px solid var(--border); padding: 6px; border-radius: 6px; background: #fafafa; display: flex; flex-direction: column; gap: 6px; }
    .photo-card img { width: 100%; height: auto; max-height: 220px; object-fit: contain; background: #eaefe9; border-radius: 4px; }
    .photo-card-actions { display: flex; justify-content: flex-end; }

    @media (max-width: 600px) {
      .photo-grid { grid-template-columns: 1fr; }
      .controls-header { flex-direction: column; align-items: stretch; }
      .controls-header > div { display: flex; flex-direction: column; gap: 8px; }
    }

    @media print {
      @page { margin: 10mm 8mm; }
      body { background-color: white; padding: 0; font-size: 9pt; }
      .container { box-shadow: none; border-radius: 0; padding: 0; max-width: 100%; overflow: visible; }
      .no-print { display: none !important; }
      .print-header { display: flex !important; page-break-after: avoid; }
      .section-block { page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 14px; }
      .sample-block { page-break-inside: avoid !important; break-inside: avoid !important; margin-bottom: 12px; }
      .photo-grid { display: grid !important; grid-template-columns: repeat(2, 1fr) !important; gap: 12px !important; page-break-inside: auto !important; break-inside: auto !important; }
      .photo-card { page-break-inside: avoid !important; break-inside: avoid !important; border: 1px solid #cbd5e1 !important; display: flex !important; flex-direction: column !important; }
      .photo-card img { max-height: 200px !important; object-fit: contain !important; page-break-inside: avoid !important; break-inside: avoid !important; }
      
      input, textarea, select { display: none !important; }
      .print-text-block { display: flex !important; border-bottom: 1px solid #cbd5e1; padding-bottom: 2px; min-height: 16px; font-size: 9pt !important; }
      table .print-text-block { border-bottom: none !important; }
      
      .yn-item { border: none !important; border-bottom: 1px dotted #cbd5e1 !important; }
      .section-title { background-color: #f1f5f9 !important; color: #0f172a !important; border: 1px solid #cbd5e1; page-break-after: avoid; }
      .sig-container { border: none; border-bottom: 1px solid #000; height: 75px; }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="print-header">
    <div class="header-title">Daily Water Quality Monitoring Report</div>
    <img id="headerLogoDisplay" src="" alt="Company Logo" style="display: none;">
  </div>
  
  <div class="form-content">
    <div class="controls-header no-print">
      <div>
        <label for="logoInput"><strong>Company Logo (Header):</strong></label>
        <input type="file" id="logoInput" accept="image/*" onchange="previewLogo(event)" style="padding: 0; border: none;">
      </div>
      <div style="display:flex; gap: 8px; flex-wrap: wrap; align-items: center; justify-content: center;">
        <button class="btn btn-warning" type="button" onclick="manualSaveProgress()">Save Progress</button>
        <div class="save-indicator-container">
          <span id="saveStatusIndicator" style="font-size: 0.8rem; color: #475569;"></span>
        </div>
        <button class="btn btn-success" type="button" onclick="downloadMasterTemplate()">Download Template</button>
        <button class="btn btn-secondary" type="button" onclick="document.getElementById('masterFileInput').click()">Upload Template</button>
        <input type="file" id="masterFileInput" accept=".json" style="display:none;" onchange="uploadMasterTemplate(event)">
      </div>
    </div>

    <!--
      NOTE: The remainder of the form (section blocks, sample tables, yn-grid items,
      photo-grid, signature canvas markup, and the closing <script> block containing
      saveProgress(), downloadMasterTemplate(), uploadMasterTemplate(),
      initSignatureCanvas(), and preparePrintView()) was not fully included in the
      source material provided and is therefore not reproduced here verbatim.
      Paste your existing markup/script back into this section — no changes are
      required there for offline support, since those functions already rely only
      on localStorage, Blob/FileReader, and Canvas APIs, none of which need network
      access [AI KNOWLEDGE]({}).
    -->

  </div>
</div>

</body>
</html>
